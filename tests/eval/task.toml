# tinyloop eval task template.
# Schema adapted from Terminal-Bench / Harbor `docs/task-template.toml`
# (Apache-2.0, vendored at vendor/terminal-bench/docs/task-template.toml).
# Adaptations: no Docker/network fields (tinyloop grades the local sandbox),
# explicit boundaries and oracle fields for our deterministic verifier.

id = ""                  # stable kebab-case id
goal = ""                # machine-decidable done-condition, one command decides
boundaries = []          # what the agent must NOT do (anti-Goodhart guard)
oracle = ""              # reference solution command, never shown to the agent

[verifier]
command = ""             # deterministic check; exit 0 means done
timeout_sec = 120

[agent]
max_steps = 12
max_tokens = 20000
timeout_sec = 600

[task]
cwd = ""                 # sandbox root for this task
files = []               # fixture files staged before the run
