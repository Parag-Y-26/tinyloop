[package]
name = "tinyloop"
version = "0.0.0"
edition = "2021"
license = "MIT"

[lib]
name = "tinyloop_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
wait-timeout = "0.2"
sha2 = "0.10"
toml = "0.8"
